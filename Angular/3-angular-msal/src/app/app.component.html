<mat-toolbar class="mat-elevation-z4" color="primary">
  <div>
    <h2 [style.cursor]="'pointer'" [routerLink]="['/']" class="mat-title">Azure Application</h2>
    <button mat-button [routerLink]="['blog']">Blog</button>
    <button mat-button [routerLink]="['profile']" *ngIf="isUserLogin">Profile</button>
  </div>

  <div>
    <button mat-raised-button *ngIf="!isUserLogin" (click)="login()">Login</button>
    <button mat-raised-button *ngIf="isUserLogin" (click)="logout()">Logout</button>
  </div>
</mat-toolbar>

<router-outlet></router-outlet>
