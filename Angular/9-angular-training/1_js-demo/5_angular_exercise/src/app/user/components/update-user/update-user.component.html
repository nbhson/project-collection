<div class="update__user">
  <div *ngIf="user !== '--'; else userUndefined">
    <form *ngIf="form" [formGroup]="form">
      <h2 mat-dialog-title>Update User</h2>
      <mat-dialog-content>
        <mat-form-field [style.width.%]="100" appearance="outline">
          <mat-label>Name</mat-label>
          <input
            [(ngModel)]="user.name"
            type="text"
            autocomplete="off"
            required
            matInput
            placeholder="Enter name"
            formControlName="name"
          />
          <mat-error *ngIf="f['name'].errors">
            <span *ngIf="f['name'].errors['required']">Name is required!</span>
            <span *ngIf="f['name'].errors['minlength']">Name is short!</span>
          </mat-error>
        </mat-form-field>
        <mat-form-field [style.width.%]="100" appearance="outline">
          <mat-label>Email</mat-label>
          <input
            [(ngModel)]="user.email"
            type="email"
            autocomplete="off"
            required
            matInput
            placeholder="Enter email"
            formControlName="email"
          />
          <mat-error *ngIf="f['email'].errors">
            <span *ngIf="f['email'].errors['required']">Email is required!</span>
          </mat-error>
        </mat-form-field>
        <mat-form-field [style.width.%]="100" appearance="outline">
          <mat-label>Phone</mat-label>
          <input
            [(ngModel)]="user.phone"
            type="text"
            autocomplete="off"
            required
            matInput
            placeholder="Enter phone"
            formControlName="phone"
          />
          <mat-error *ngIf="f['phone'].errors">
            <span *ngIf="f['phone'].errors['required']">Phone is required!</span>
          </mat-error>
        </mat-form-field>
        <mat-form-field [style.width.%]="100" appearance="outline">
          <mat-label>Select an option</mat-label>
          <mat-select required [(value)]="user.gender">
            <mat-option value="Male">Male</mat-option>
            <mat-option value="Female">Female</mat-option>
          </mat-select>
          <mat-error *ngIf="f['gender'].errors">
            <span *ngIf="f['gender'].errors['required']">Phone is required!</span>
          </mat-error>
        </mat-form-field>
        <mat-form-field [style.width.%]="100" appearance="outline">
          <mat-label>Introduce</mat-label>
          <textarea matInput placeholder="Textarea" formControlName="introduce" [(ngModel)]="user.introduce"></textarea>
        </mat-form-field>
      </mat-dialog-content>
      <mat-dialog-actions class="cs-pt-3 cs-pb-3">
        <div>
          <button mat-button color="accent" [routerLink]="['/']">Back to users management</button>
          <button mat-raised-button color="primary" (click)="submit()">Update</button>
        </div>
      </mat-dialog-actions>
    </form>
  </div>

  <ng-template #userUndefined> Can't find this user! </ng-template>
</div>
