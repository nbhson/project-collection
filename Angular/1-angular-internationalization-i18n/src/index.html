<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AngularPhraseExample</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <button id="dt" style="position:fixed;top:8px;right:8px;z-index:9999;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;background:var(--ds-surface);color:var(--ds-text);">🌙</button>
  <script>document.getElementById('dt')?.addEventListener('click',()=>{document.body.classList.toggle('dark');});</script>
  <app-root></app-root>
</body>
</html>
